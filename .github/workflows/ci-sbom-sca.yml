name: Security - SBOM & SCA

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/ci-sbom-sca.yml"

permissions:
  contents: read

concurrency:
  group: sbom-sca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom_sca:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dir
        run: mkdir -p EVIDENCE/P09

      - name: Install jq (for summary)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate SBOM (Syft CycloneDX)
        run: |
          docker run --rm -v "$PWD":/work -w /work anchore/syft:latest \
            packages dir:. -o cyclonedx-json > EVIDENCE/P09/sbom.json
        timeout-minutes: 10

      - name: SCA Scan (Grype - scan SBOM)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -w /work anchore/grype:latest \
            grype -o json sbom:/work/EVIDENCE/P09/sbom.json > EVIDENCE/P09/sca_report.json
        timeout-minutes: 12

      - name: Create SCA summary
        run: |
          echo "# SCA summary" > EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md
          echo "## counts by severity" >> EVIDENCE/P09/sca_summary.md
          jq -r '.matches[].vulnerability.severity // "UNKNOWN"' EVIDENCE/P09/sca_report.json \
            | tr '[:upper:]' '[:lower:]' | sort | uniq -c | awk '{print "- " $2 ": " $1}' >> EVIDENCE/P09/sca_summary.md || true
          echo "" >> EVIDENCE/P09/sca_summary.md
          echo "## top findings (first 20)" >> EVIDENCE/P09/sca_summary.md
          jq -r '.matches[] | [.vulnerability.id, .artifact.name, .vulnerability.severity] | @tsv' EVIDENCE/P09/sca_report.json \
            | head -n 20 | awk -F'\t' '{print "- " $1 " — " $2 " — " $3}' >> EVIDENCE/P09/sca_summary.md || true

      - name: Upload SBOM/SCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P09_EVIDENCE
          path: EVIDENCE/P09
          retention-days: 14
