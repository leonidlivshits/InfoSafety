name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "security/semgrep/**"
      - "security/.gitleaks.toml"
      - ".github/workflows/ci-sast-secrets.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "security/semgrep/**"
      - "security/.gitleaks.toml"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure evidence dir
        run: mkdir -p EVIDENCE/P10

      - name: Run Semgrep (SAST) - generate SARIF
        run: |
          echo "Running Semgrep..."
          docker run --rm \
            -v "$PWD":/src -w /src \
            returntocorp/semgrep:latest \
            semgrep scan \
              --config=p/ci \
              --config=security/semgrep/rules.yml \
              --sarif \
              --output=EVIDENCE/P10/semgrep.sarif \
              --metrics=off || echo "Semgrep finished (exit code != 0) - findings saved"

      - name: Run Gitleaks (Secrets detection)
        run: |
          echo "Running Gitleaks..."
          docker run --rm \
            -v "$PWD":/repo \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --no-banner \
              --config=/repo/security/.gitleaks.toml \
              --source=/repo \
              --report-format=json \
              --report-path=/repo/EVIDENCE/P10/gitleaks.json \
              --verbose || echo "Gitleaks finished (exit code != 0) - report saved"

      - name: Generate summary
        run: |
          echo "# SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "**Scan Date:** $(date -u)" >> EVIDENCE/P10/sast_summary.md
          echo "**Commit:** ${{ github.sha }}" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          if [ -f EVIDENCE/P10/semgrep.sarif ]; then
            total_findings=$(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
            echo "## Semgrep findings: $total_findings" >> EVIDENCE/P10/sast_summary.md
          else
            echo "No Semgrep report" >> EVIDENCE/P10/sast_summary.md
          fi

          if [ -f EVIDENCE/P10/gitleaks.json ]; then
            leaks_count=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
            echo "## Gitleaks potential secrets: $leaks_count" >> EVIDENCE/P10/sast_summary.md
          else
            echo "No Gitleaks report" >> EVIDENCE/P10/sast_summary.md
          fi

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: EVIDENCE/P10/semgrep.sarif
          wait-for-processing: true

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-evidence
          path: EVIDENCE/P10
          retention-days: 30

      - name: Print summary (logs)
        if: always()
        run: |
          echo "---- SAST summary ----"
          sed -n '1,200p' EVIDENCE/P10/sast_summary.md || true
