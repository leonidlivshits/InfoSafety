name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check-branch-protection:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Reject direct push to main
        run: |
          echo "ERROR: Direct pushes to main are forbidden!"
          echo "This push was made by: ${{ github.actor }}"
          exit 1

  sbom-sca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SBOM & SCA
        run: |
          echo "SBOM/SCA workflow is provided by .github/workflows/ci-sbom-sca.yml"
          echo "Run that workflow via workflow_dispatch or let it run on changes."

  build:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache pip deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}"
          restore-keys: |
            "${{ runner.os }}-python-${{ matrix.python-version }}-pip-"
            "${{ runner.os }}-python-${{ matrix.python-version }}-"
            "${{ runner.os }}-"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check --output-format=github .
          black --check .
          isort --check-only .

      - name: Tests
        run: pytest -q

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "test-reports-${{ matrix.python-version }}"
          path: |
            .pytest_cache
            .coverage
            coverage.xml

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for hardcoded secrets (simple grep)
        run: |
          echo "Checking for potential secrets..."
          if grep -r -E "(=|\"|')\s*(password|secret|key|token|api[_-]?key)\s*(=|\"|')\s*[^\"'][^,]*[^\"']" \
              --include="*.py" --include="*.env" --include="*.yaml" --include="*.yml" . \
              | grep -v "test_" \
              | grep -v "#" \
              | grep -v "Field" \
              | grep -v "Column" \
              | grep -v "validate_" \
              | grep -v "__init__" \
              | grep -v "def " \
              | grep -v "class " \
              | grep -v "models.py" \
              | grep -v "schemas.py" \
              | grep -v "errors.py"; then
            echo "Potential hardcoded secrets found in code"
            exit 1
          fi
          echo "No hardcoded secrets found"

  deploy-staging:
    needs: [build, security-check, sbom-sca]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Simulate deploy
        run: |
          echo "Health check..."
          echo "Staging env is ready"

  deploy-prod:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: production
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Prod deploy simulation
        run: |
          echo "Deploying to PRODUCTION..."
          echo "Version: ${{ github.event.release.tag_name }}"
          echo "Production deployment simulation completed"
