[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
per-file-ignores = { "tests/conftest.py" = ["E402"] }

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true

[tool.black]
line-length = 100
target-version = ['py311']
